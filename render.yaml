services:
  - type: web
    name: akash-workspace-backend
    env: python
    region: oregon
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: akash-workspace-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: akash-workspace-db
    plan: free
    region: oregon
