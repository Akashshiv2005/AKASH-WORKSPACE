version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: notion_clone_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: notion_clone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notion_clone_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:password123@postgres:5432/notion_clone
      SECRET_KEY: notion_clone_super_secret_jwt_key_change_in_production_2026!#$
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: notion_clone_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
